name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: ci-only-not-for-production
  DJANGO_DEBUG: "0"
  FRONTEND_URL: http://localhost:5173
  SMS_DUMMY_MODE: "0"
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_PHONE: ""
  TWILIO_WEBHOOK_ALLOW_UNSIGNED: "0"
  LINE_CHANNEL_ACCESS_TOKEN: ""
  LINE_CHANNEL_SECRET: ""
  CTI_SHARED_TOKEN: ""

jobs:
  backend-quality:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python3 -m pip install --upgrade pip==26.2
          python3 -m pip install -r requirements.txt pip-audit==2.10.1

      - name: Run Django system checks
        run: python3 manage.py check

      - name: Check for missing migrations
        run: python3 manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: python3 manage.py spectacular --validate --fail-on-warn --file /tmp/roomink-schema.yml

      - name: Check Python syntax
        run: python3 -m compileall -q config core

      - name: Check installed dependency consistency
        run: python3 -m pip check

      - name: Audit Python dependencies
        run: python3 -m pip_audit

  backend-tests:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - sqlite
          - postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: roomink_ci
          POSTGRES_USER: roomink_ci
          POSTGRES_PASSWORD: roomink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomink_ci -d roomink_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Use PostgreSQL test database
        if: matrix.database == 'postgres'
        run: echo "USE_POSTGRES=1" >> "$GITHUB_ENV"

      - name: Run Django tests
        env:
          POSTGRES_DB: roomink_ci
          POSTGRES_USER: roomink_ci
          POSTGRES_PASSWORD: roomink_ci
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
        run: python3 manage.py test core

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm 11
        run: npm install --global npm@11.12.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
